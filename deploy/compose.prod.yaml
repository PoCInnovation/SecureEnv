# Production-like deployment: Vault with integrated storage, TLS and audit
# logs, and the API talking to it over TLS. See deploy/README.md.
name: secureenv

services:
  vault:
    image: hashicorp/vault:2.1.0
    command: server
    restart: unless-stopped
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /vault/certs/ca.pem
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - ./vault/policies:/vault/policies:ro
      - ./vault/scripts:/vault/scripts:ro
      - ./vault/certs:/vault/certs:ro
      - vault-data:/vault/file
      - vault-logs:/vault/logs
    ports:
      - "8200:8200"

  api:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      - vault
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /certs/ca.pem
      SECURE_ENV_VAULT_PREFIX: secureenv
      SECURE_ENV_TLS_CERT_FILE: /certs/api.pem
      SECURE_ENV_TLS_KEY_FILE: /certs/api-key.pem
    volumes:
      - ./vault/certs:/certs:ro
    ports:
      - "8080:8080"

volumes:
  vault-data:
  vault-logs:
